[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invariantaudio"
version = "0.1.0a1"
description = "A privacy-first, fail-closed toolkit for verifying music-library integrity and applying journaled, hash-verified metadata changes."
readme = "README.md"
authors = [
    { name = "InvariantAudio Contributors" }
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Archiving",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]
keywords = ["music", "metadata", "audio", "audiophile", "integrity", "tagger", "safety", "fail-closed"]
requires-python = ">=3.10"
dependencies = [
    "mutagen>=1.45.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "flake8>=6.0",
    "black>=23.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/thathugesamoan-byte/invariantaudio"
Issues = "https://github.com/thathugesamoan-byte/invariantaudio/issues"
Changelog = "https://github.com/thathugesamoan-byte/invariantaudio/blob/main/CHANGELOG.md"

[project.scripts]
invariant-audio = "invariantaudio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
