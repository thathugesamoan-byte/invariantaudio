name: Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ffmpeg and Chromaprint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libchromaprint-tools
      - name: Install the package with dev tools
        run: python -m pip install -e ".[dev]"
      - name: Lint (pyflakes-class errors)
        run: python -m flake8 src tests
      - name: Type check
        run: python -m mypy src
      - name: Run tests
        run: python -m pytest -q
      - name: Build, install the wheel into a clean venv, smoke-test and run the tests against it
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install build
          python -m build
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install dist/*.whl pytest
          mkdir /tmp/suite && cp -r tests config.example.yaml /tmp/suite/
          cd /tmp/suite
          /tmp/wheelenv/bin/invariant-audio verify tests/fixtures/synthetic_test_track.mp3
          /tmp/wheelenv/bin/python -c "import invariantaudio, sys; print(invariantaudio.__file__); assert '/tmp/wheelenv' in invariantaudio.__file__"
          /tmp/wheelenv/bin/python -m pytest -q
