# InvariantAudio v0.1.0-alpha - example configuration.
# Copy to config.yaml (git-ignored) and replace the placeholder paths.
#
# Parsing is strict: booleans must be YAML booleans (true/false, not "false"),
# unknown keys are errors, and all six path keys are required.

# Directories. work_root (staging) must be on the same filesystem as media_root.
media_root: "/path/to/music"
database_path: "/path/to/music_catalog.sqlite3"
backup_root: "/path/to/backups"
quarantine_root: "/path/to/quarantine"
work_root: "/path/to/staging"

# Locking & safety
mutation_lock_path: "/path/to/.invariant_audio.lock"
batch_size_limit: 10
# These two cannot be set to false in v0.1.0-alpha; the engine always enforces them.
enforce_payload_pcm_preservation: true
enforce_source_continuity: true

# External identification is NOT implemented in v0.1.0-alpha (no network code).
# These keys are validated and reserved for a future release.
musicbrainz:
  rate_limit_seconds: 1.0      # must be >= 1.0
  user_agent: "InvariantAudio/0.1.0a1 ( https://github.com/thathugesamoan-byte/invariantaudio )"
  enable_acoustid_lookup: false      # reserved; true is rejected
  enable_acoustid_submission: false  # prohibited; true is rejected

# Parsed and validated, but not yet consumed by the scorer (see docs/identification.md).
scoring:
  min_auto_approval_score: 0.80
  max_auto_approval_runner_up: 0.20
  min_auto_approval_margin: 0.60
  duration_tolerance_seconds: 3.0
  min_acoustic_overlap_frames: 150
